[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tsuchinoko"
dependencies = [
  "gpCAM~=8.2.3",
  "fvgp~=4.6.5",
  "numpy",
  "scipy",
  "scikit-learn",
  "click",
  "loguru",
  "appdirs",
  "transitions",
  "pydantic>=2.0",
  "pyyaml",
  "nats-py>=2.0",
  "tiled[client]",
  "bluesky-tiled-plugins",
  "httpx[socks]",
]
requires-python = ">=3.9"
authors = [
  {name = "Ronald J. Pandolfi", email = "ronpandolfi@lbl.gov"},
]
maintainers = [
  {name = "Ronald J. Pandolfi", email = "ronpandolfi@lbl.gov"}
]
description = "An adaptive experiment service powered by Gaussian Processes"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["autonomous", "self driving", "adaptive", "gaussian process", "optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Natural Language :: English",
]
dynamic = ["version"]

[project.optional-dependencies]
gui = [
  "pyside6<6.9.1",
  "pyqtgraph",
  "qtmodern",
  "pyopengl",
  "pyopengl-accelerate",
  "qtconsole",
  "bluesky",
  "ophyd",
  "zmq",
  "pillow",
]
dev = ["pyinstaller", "pillow"]
docs = ["matplotlib", "sphinx", "sphinx-markdown-tables", "numpydoc", "sphinx_copybutton", "myst_parser", "sphinx_rtd_theme", "sphinx_rtd_dark_mode"]
tests = ["pillow", "pytest", "coverage", "coveralls", "codecov", "pylint", "pytest-qt", "pytest-cov", "pytest-lazy-fixtures", "pytest-asyncio", "tiled[server]"]

[project.urls]
Homepage = "https://tsuchinoko.readthedocs.io/"
Documentation = "https://tsuchinoko.readthedocs.io/"
Repository = "https://github.com/lbl-camera/tsuchinoko.git"
"Bug Tracker" = "https://github.com/lbl-camera/tsuchinoko/issues"
Changelog = "https://github.com/lbl-camera/tsuchinoko/commits/master/"

[project.scripts]
tsuchinoko = "tsuchinoko.cli:main"
tsuchinoko_demo = "tsuchinoko:launch_server"
tsuchinoko_bootstrap = "tsuchinoko:bootstrap"

[project.gui-scripts]
tsuchinoko-gui = "tsuchinoko:launch_client"

#[project.entry-points."spam.magical"]
#tomatoes = "spam:main_tomatoes"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "tsuchinoko/_version.py"

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
